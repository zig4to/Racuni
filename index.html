<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12151b">
<meta name="description" content="Slikaj račun, aplikacija izreže bel list in ga shrani kot JPG.">
<title>Računi — slikaj in obreži</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Računi">
<meta name="application-name" content="Računi">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">🧾</span>
    <h1>Računi</h1>
  </div>
  <div class="topbar-right">
    <button id="btnInstall" class="btn btn-sm btn-install" hidden>⬇ Namesti</button>
    <span id="storageInfo" class="muted"></span>
  </div>
</header>

<main>
  <!-- ================= GALERIJA ================= -->
  <section id="viewGallery">
    <div id="captureRow" class="capture">
      <button id="btnCamera" type="button" class="btn btn-primary">📷 Slikaj račun</button>
      <button id="btnPicker" type="button" class="btn">🖼️ Izberi sliko</button>
    </div>
    <input id="inputCamera" type="file" accept="image/*" capture="environment" hidden>
    <input id="inputPicker" type="file" accept="image/*" hidden>

    <div id="formNew" class="form-new" hidden>
      <h2 class="section-title">Nov račun</h2>
      <div class="field">
        <label for="fTrgovina">Trgovina</label>
        <input id="fTrgovina" type="text" placeholder="npr. Mercator" autocomplete="off">
      </div>
      <div class="field">
        <label for="fIzdelek">Izdelek</label>
        <input id="fIzdelek" type="text" placeholder="npr. Pralni stroj" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="fDatum">Datum nakupa</label>
          <input id="fDatum" type="date">
        </div>
        <div class="field">
          <label for="fGarancija">Garancija (let)</label>
          <input id="fGarancija" type="number" min="0" step="1" inputmode="numeric" placeholder="npr. 2">
        </div>
      </div>
      <div class="actions">
        <button id="btnFormCancel" type="button" class="btn">Prekliči</button>
        <button id="btnFormNext" type="button" class="btn btn-primary form-next" disabled>Naprej →</button>
      </div>
    </div>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
        <line x1="21" y1="21" x2="16.2" y2="16.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" type="search" class="search-input" placeholder="Išči po dobavitelju, znesku, datumu …" autocomplete="off" enterkeyhint="search">
    </div>

    <hr class="divider">

    <h2 class="section-title">Shranjeni računi</h2>

    <p id="emptyState" class="empty" hidden>
      <span class="empty-mark">🧾</span>
      Ni še shranjenih računov.
      <span class="muted">Slikaj račun na temni podlagi (miza, tla) — bel list bo samodejno izrezan.</span>
    </p>

    <div id="grid" class="grid"></div>
  </section>

  <!-- ================= UREJANJE ================= -->
  <section id="viewEdit" hidden>
    <div id="stageWrap" class="stage-wrap">
      <div id="stage" class="stage">
        <canvas id="preview"></canvas>
        <svg id="overlay" preserveAspectRatio="none">
          <path id="shade" fill="rgba(0,0,0,0.55)" fill-rule="evenodd"></path>
          <polygon id="quad" fill="none" stroke="#4ade80" stroke-width="2" vector-effect="non-scaling-stroke"></polygon>
        </svg>
        <div class="handle" data-i="0"></div>
        <div class="handle" data-i="1"></div>
        <div class="handle" data-i="2"></div>
        <div class="handle" data-i="3"></div>
      </div>
    </div>

    <p id="hint" class="hint">Povleci vogale, če izrez ni točen.</p>

    <div class="toolbar">
      <label class="check"><input id="enhance" type="checkbox" checked> Posvetli / poravnaj barve</label>
      <button id="btnRotate" class="btn btn-sm">↻ Zavrti</button>
      <button id="btnReset" class="btn btn-sm">⟲ Ponovna zaznava</button>
    </div>

    <div class="actions">
      <button id="btnCancel" class="btn">Prekliči</button>
      <button id="btnCrop" class="btn btn-primary">✓ Obreži in shrani</button>
    </div>
  </section>
</main>

<!-- ================= PREGLED SHRANJENEGA ================= -->
<div id="viewer" class="viewer" hidden>
  <div class="viewer-bar">
    <button id="btnClose" class="btn btn-sm">✕ Zapri</button>
    <span id="viewerMeta" class="muted"></span>
  </div>
  <div class="viewer-img"><img id="viewerImg" alt="Shranjen račun"></div>
  <div class="viewer-actions">
    <button id="btnDownload" class="btn btn-primary">⬇ Prenesi JPG</button>
    <button id="btnShare" class="btn" hidden>↗ Deli</button>
    <button id="btnDelete" class="btn btn-danger">🗑 Izbriši</button>
  </div>
</div>

<div id="busy" class="busy" hidden><div class="spinner"></div><span id="busyText">Obdelujem…</span></div>

<script src="js/db.js"></script>
<script src="js/detect.js"></script>
<script src="js/app.js"></script>
</body>
</html>
